name: Backend Tests

on:
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "alembic.ini"
      - "apps/api/alembic/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "alembic.ini"
      - "apps/api/alembic/**"

jobs:
  test:
    name: Lint + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kongjianguanli_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # LLM 必须禁用，避免 CI 走真实 NVIDIA endpoint 造成 flaky
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      # 测试 DB 走 service 容器
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kongjianguanli_test
      JWT_SECRET_KEY: ci-test-secret-please-rotate
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 同时拉取 web 子模块（README / e2e 提到它，但测试本身不需要它）
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint (ruff)
        working-directory: apps/api
        run: |
          ruff check app tests --output-format=github

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for postgres... ($i)"
            sleep 1
          done

      - name: Apply migrations
        run: |
          PYTHONPATH=apps/api alembic --config alembic.ini upgrade head

      - name: Run pytest
        working-directory: apps/api
        run: |
          PYTHONPATH=. python -m pytest -v --tb=short --maxfail=5

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: apps/api/.pytest_output/
          if-no-files-found: ignore